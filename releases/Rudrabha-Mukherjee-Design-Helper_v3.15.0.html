<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rudrabha Mukherjee's Design Helper</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#F8F8F6">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--statusH:0px;--botH:56px;--topH:56px;
  --ease:cubic-bezier(0.2, 0, 0, 1);--fast:120ms;--base:180ms;--slow:260ms;
  --lift-1:0 1px 2px rgba(16,24,32,.06), 0 1px 3px rgba(16,24,32,.08);
  --lift-2:0 4px 12px rgba(16,24,32,.10);
  --lift-3:0 -4px 20px rgba(16,24,32,.12);
  --scrim:rgba(16,24,32,.42);
  --r-ctrl:8px;--r-card:12px;--r-sheet:16px}
:root, :root[data-theme="light"]{
  --ground:#F8F8F6; --surface:#FFFFFF; --sect:#F1F1EE;
  --ink:#15171A; --muted:#545B66; --quiet:#767E8C;
  --rule:#E0E2E6; --rule-soft:#ECEEF1;
  --go:#F2C94C; --go-soft:#FCF5DC;
  --brand:#F2C94C; --brand-soft:#FCF5DC;
  --caution:#8C5800; --caution-soft:#FCF5DC;
  --danger:#C53B27; --focus:#15171A;
  --maxw:720px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --sans:"Inter Display","Inter Variable","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
:root[data-theme="night"]{
  --ground:#14110C; --surface:#1E1A13; --sect:#26211A;
  --ink:#F6EFE2; --muted:#D9CDB8; --quiet:#C4B69E;
  --rule:#5A4E3C; --rule-soft:#3B3327;
  --go:#D8C08A; --go-soft:#2C2416;
  --caution:#E8B27A; --caution-soft:#33230F;
  --danger:#E8A183; --focus:#D8C08A;
  --lift-1:0 1px 2px rgba(0,0,0,.32), 0 1px 3px rgba(0,0,0,.36);
  --lift-2:0 4px 16px rgba(0,0,0,.44);
  --lift-3:0 -4px 24px rgba(0,0,0,.48);
  --scrim:rgba(0,0,0,.56);
}
:root[data-theme="night"] .btn{background:#EDE3CE;border-color:#EDE3CE;color:#14110C}
:root[data-theme="night"] .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--rule)}
:root[data-theme="night"] .btn.go{background:#7A6534;border-color:#7A6534;color:#FFF8E8}
:root[data-theme="night"] .btn.danger{background:#8A4A2E;border-color:#8A4A2E;color:#FFF}
:root[data-theme="night"] .sizer button[aria-pressed="true"]{background:#EDE3CE;color:#14110C;border-color:#EDE3CE}
:root[data-theme="night"] .step.done .dot{color:#14110C}
:root[data-theme="night"] .foot{background:#0F0D09}
:root[data-theme="night"] .botbar{background:#0F0D09}
:root[data-theme="contrast"]{
  --ground:#FFFFFF; --surface:#FFFFFF; --sect:#FFFFFF;
  --ink:#000000; --muted:#000000; --quiet:#000000;
  --rule:#000000; --rule-soft:#000000;
  --go:#00451F; --go-soft:#FFFFFF;
  --caution:#5A2B00; --caution-soft:#FFFFFF;
  --danger:#7A0000; --focus:#0033CC;
}
:root[data-theme="contrast"] .card,:root[data-theme="contrast"] .refrow,
:root[data-theme="contrast"] .prompt,:root[data-theme="contrast"] .note,
:root[data-theme="contrast"] .warnbox,:root[data-theme="contrast"] .opt,
:root[data-theme="contrast"] .btn,:root[data-theme="contrast"] .menu-group{border-width:3px}
:root[data-theme="contrast"] .kv{border-top-width:3px}
:root[data-theme="dark"]{
  --ground:#15171A; --surface:#1C1F24; --sect:#24282E;
  --ink:#FFFFFF; --muted:#9DA7B3; --quiet:#6B7684;
  --rule:#333A42; --rule-soft:#252A30;
  --go:#F2C94C; --go-soft:#2D2510;
  --brand:#F2C94C; --brand-soft:#2D2510;
  --caution:#F2C94C; --caution-soft:#2D2510;
  --danger:#E05D44; --focus:#F2C94C;
  --lift-1:0 1px 2px rgba(0,0,0,.32), 0 1px 3px rgba(0,0,0,.36);
  --lift-2:0 4px 16px rgba(0,0,0,.44);
  --lift-3:0 -4px 24px rgba(0,0,0,.48);
  --scrim:rgba(0,0,0,.56);
}
:root[data-theme="dark"] .btn{background:#FFFFFF;border-color:#FFFFFF;color:#15171A}
:root[data-theme="dark"] .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--rule)}
:root[data-theme="dark"] .btn.go{background:#F2C94C;border-color:#F2C94C;color:#15171A}
:root[data-theme="dark"] .btn.danger{background:#B0402A;border-color:#B0402A;color:#fff}
:root[data-theme="dark"] .sizer button[aria-pressed="true"]{background:#F2C94C;color:#15171A;border-color:#F2C94C}
:root[data-theme="dark"] .step.done .dot{color:#15171A}
:root[data-theme="dark"] .foot{background:#111316}
:root[data-theme="dark"] .botbar{background:#111316}

/* Match my device — reuse dark palette when the OS is dark and no explicit theme is set */
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --ground:#15171A; --surface:#1C1F24; --sect:#24282E;
    --ink:#FFFFFF; --muted:#9DA7B3; --quiet:#6B7684;
    --rule:#333A42; --rule-soft:#252A30;
    --go:#F2C94C; --go-soft:#2D2510;
    --brand:#F2C94C; --brand-soft:#2D2510;
    --caution:#F2C94C; --caution-soft:#2D2510;
    --danger:#E05D44; --focus:#F2C94C;
    --lift-1:0 1px 2px rgba(0,0,0,.32), 0 1px 3px rgba(0,0,0,.36);
    --lift-2:0 4px 16px rgba(0,0,0,.44);
    --lift-3:0 -4px 24px rgba(0,0,0,.48);
    --scrim:rgba(0,0,0,.56);
  }
  :root:not([data-theme]) .btn{background:#FFFFFF;border-color:#FFFFFF;color:#15171A}
  :root:not([data-theme]) .btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--rule)}
  :root:not([data-theme]) .btn.go{background:#F2C94C;border-color:#F2C94C;color:#15171A}
  :root:not([data-theme]) .btn.danger{background:#B0402A;border-color:#B0402A;color:#fff}
  :root:not([data-theme]) .sizer button[aria-pressed="true"]{background:#F2C94C;color:#15171A;border-color:#F2C94C}
  :root:not([data-theme]) .step.done .dot{color:#15171A}
  :root:not([data-theme]) .foot{background:#111316}
  :root:not([data-theme]) .botbar{background:#111316}
}

*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;overflow-x:hidden;-webkit-tap-highlight-color:rgba(19,78,158,.18);
  background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit;touch-action:manipulation}
input,textarea,select{max-width:100%;touch-action:manipulation;font:inherit}
h1,h2,h3{margin:0;font-weight:700;line-height:1.25;letter-spacing:-0.02em}
h1{font-size:1.66rem}h2{font-size:1.24rem}h3{font-size:1.06rem}
p{margin:0 0 var(--s3)}p:last-child{margin-bottom:0}
.lede{color:var(--muted);max-width:60ch}
.about-name{font-size:1.12rem;font-weight:680;margin:0 0 var(--s2)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
mark{background:#F2C94C;color:#15171A;padding:0 .12em;border-radius:2px;font-weight:600}
:root[data-theme="dark"] mark,:root:not([data-theme]) mark{background:#F2C94C;color:#15171A}

/* top bar — sticky 56px + safe area; never static on phone */
.topbar{position:sticky;top:0;z-index:40;background:var(--ground);border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top);transition:box-shadow var(--base) var(--ease);box-sizing:border-box}
.topbar.scrolled{box-shadow:var(--lift-1)}
.topbar-in{max-width:var(--maxw);margin:0 auto;height:56px;min-height:56px;padding:0 max(var(--s3),env(safe-area-inset-left)) 0 max(var(--s3),env(safe-area-inset-right));
  display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:var(--s2)}
.navbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;
  background:none;border:0;border-radius:var(--r-ctrl);cursor:pointer;color:var(--ink);flex:none;grid-column:1;justify-self:start}
#fwdBtn.navbtn{grid-column:3;justify-self:end}
.navbtn[hidden]{display:none!important}
.navbtn svg{width:24px;height:24px;display:block}

.top-title.brand{grid-column:2;margin:0;min-width:0;text-align:center;font-size:15px;font-weight:700;line-height:1.2;color:var(--ink);white-space:normal}
.top-title.brand .pre{font-weight:700;font-size:inherit;color:inherit;display:inline}
.top-title.brand .mark{font-weight:700;font-size:inherit;color:inherit;display:inline}

.top-title{grid-column:2;margin:0;min-width:0;text-align:center;font-size:15px;font-weight:700;line-height:1.2;color:var(--ink);
  white-space:normal;overflow:visible;text-overflow:clip}
@media (max-width:360px){
  .top-title.brand,.top-title{font-size:13px;line-height:1.18}
}

.saved-toast{position:fixed;bottom:calc(var(--botH) + env(safe-area-inset-bottom) + 12px);left:50%;transform:translateX(-50%);z-index:60;
  background:var(--surface);color:var(--ink);border:1px solid var(--go);box-shadow:var(--lift-2);border-radius:20px;
  padding:6px 14px;font-size:.85rem;font-weight:640;pointer-events:none;opacity:0;transition:opacity var(--base) var(--ease)}
.saved-toast.show{opacity:1}
.saved-toast.warn{color:var(--caution);background:var(--caution-soft);border-color:var(--caution)}
.saved-toast.flash{background:var(--go);color:#15171A}
@media (prefers-reduced-motion: reduce){
  .saved-toast{transition:none}
}

.back-to-top{position:fixed;bottom:calc(var(--botH) + env(safe-area-inset-bottom) + 16px);right:max(16px,env(safe-area-inset-right));z-index:50;
  width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--ink);border:2px solid var(--rule);box-shadow:var(--lift-2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity var(--base) var(--ease),transform var(--base) var(--ease)}
.back-to-top.visible{opacity:1;pointer-events:auto}
.back-to-top[hidden]{display:none!important}
.back-to-top:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

details.doc-sec{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-card);margin-bottom:var(--s3);padding:var(--s3) var(--s4)}
details.doc-sec[open]{padding-bottom:var(--s4)}
details.doc-sec summary{font-weight:660;font-size:1.02rem;cursor:pointer;color:var(--ink);padding:var(--s1) 0;list-style-position:inside}
details.doc-sec summary:focus-visible{outline:3px solid var(--focus);border-radius:3px}

@media (min-width: 900px){
  .card-grid, .two-col{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s4)}
}
.sizer{display:flex;align-items:center;gap:var(--s1)}
.sizer .lab{font-size:.85rem;color:var(--quiet)}
.sizer button{min-width:48px;min-height:48px;border:2px solid var(--rule);background:var(--surface);border-radius:var(--r-ctrl);cursor:pointer;font-weight:660}
.sizer button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* bottom bar */
.botbar{position:fixed;left:0;right:0;bottom:0;z-index:50;width:100%;max-width:100%;background:var(--surface);border-top:1px solid var(--rule);
  box-shadow:var(--lift-3);padding-bottom:env(safe-area-inset-bottom);box-sizing:border-box;overflow:hidden}
.botbar-in{max-width:var(--maxw);margin:0 auto;width:100%;height:55px;min-height:55px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;box-sizing:border-box}
.bot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  min-height:55px;min-width:0;width:100%;padding:4px 2px 6px;background:none;border:0;cursor:pointer;color:var(--muted);font-weight:520}
.bot .bot-ico{width:24px;height:24px;display:block}
.bot .bot-ico svg{width:24px;height:24px;display:block}
.bot .bot-lab{font-size:.72rem;line-height:1.2}
.bot[aria-current="page"]{color:var(--ink);font-weight:700}
.bot[aria-current="page"]::after{content:"";position:absolute;left:50%;bottom:4px;width:28px;height:3px;margin-left:-14px;
  background:var(--go);border-radius:2px;transition:transform var(--base) var(--ease)}
.bot:not([aria-current="page"])::after{content:"";position:absolute;left:50%;bottom:4px;width:28px;height:3px;margin-left:-14px;
  background:transparent;border-radius:2px;transform:scaleX(0);transition:transform var(--base) var(--ease)}
.bot[aria-current="page"]::after{transform:scaleX(1)}

/* status — sits above bottom bar */
.status{position:fixed;left:0;right:0;bottom:calc(var(--botH) + env(safe-area-inset-bottom));z-index:60;background:var(--go-soft);
  border-top:3px solid var(--go);box-shadow:var(--lift-1)}
.status-in{max-width:var(--maxw);margin:0 auto;
  padding:var(--s3) max(var(--s4),env(safe-area-inset-left));
  display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.status p{margin:0;font-size:1rem;color:var(--go);font-weight:600;flex:1 1 14rem}

#movedBar,#updateBar{box-shadow:var(--lift-1);animation:bannerIn var(--base) var(--ease)}
#movedBar{background:var(--caution-soft);border-bottom:3px solid var(--caution)}
#movedBar .in{max-width:var(--maxw);margin:0 auto;padding:var(--s4) max(var(--s4),env(safe-area-inset-left));
  display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
#movedBar p{margin:0;flex:1 1 18rem;color:var(--caution);font-weight:620}
#updateBar{background:var(--go-soft);border-bottom:3px solid var(--go)}
#updateBar .in{max-width:var(--maxw);margin:0 auto;padding:var(--s4) max(var(--s4),env(safe-area-inset-left));
  display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
#updateBar p{margin:0;flex:1 1 18rem;color:var(--ink);font-weight:620}
@keyframes bannerIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}

.wrap{max-width:var(--maxw);margin:0 auto;padding:var(--s2) max(var(--s4),env(safe-area-inset-left)) calc(var(--botH) + env(safe-area-inset-bottom) + var(--s7) + var(--statusH, 0px))}
#app.view-enter{animation:viewIn var(--base) var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 var(--s5);
  border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r-ctrl);font-size:1rem;font-weight:620;cursor:pointer;text-align:center;
  transition:transform var(--fast) var(--ease)}
.btn:active{transform:scale(0.98)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--rule)}
.btn.go{background:var(--go);border-color:var(--go);color:#15171A;font-weight:640}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:48px;padding:0 var(--s4);font-size:.94rem;font-weight:580}
.row{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center}
.row.end{justify-content:space-between}

/* cards + forms — flat + border */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-card);padding:var(--s5);margin-bottom:var(--s4)}
.card>h1,.card>h2{margin-bottom:var(--s3)}
.field{margin-bottom:var(--s5)}
.field label{display:block;font-size:1.06rem;font-weight:660;margin-bottom:var(--s1)}
.field .hint{font-size:.94rem;color:var(--muted);margin-bottom:var(--s2);max-width:60ch}
input[type=text]{width:100%;min-height:52px;padding:var(--s3);border:2px solid var(--rule);border-radius:var(--r-ctrl);background:var(--surface);color:var(--ink)}
select{width:100%;min-height:52px;padding:var(--s3);border:2px solid var(--rule);border-radius:var(--r-ctrl);
  background:var(--surface);color:var(--ink);line-height:1.4;-webkit-appearance:menulist;appearance:menulist}
select:focus{border-color:var(--focus)}
textarea{width:100%;min-height:150px;padding:var(--s3);line-height:1.55;border:2px solid var(--rule);border-radius:var(--r-ctrl);
  background:var(--surface);color:var(--ink);resize:vertical}
textarea.big{min-height:280px}
input:focus,textarea:focus{border-color:var(--focus)}

/* step rail */
.steps{list-style:none;margin:0 0 var(--s4);padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10rem),1fr));gap:var(--s2)}
.step button{display:flex;gap:var(--s3);align-items:center;width:100%;min-height:56px;text-align:left;background:var(--surface);
  border:2px solid var(--rule-soft);border-radius:var(--r-ctrl);padding:var(--s2) var(--s3);cursor:pointer;color:var(--muted);
  transition:transform var(--fast) var(--ease)}
.step button:active{transform:scale(0.98)}
.step.here button{border-color:var(--go);color:var(--ink)}
.step .dot{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--rule);background:var(--surface);
  display:grid;place-items:center;font-weight:700;font-size:.92rem;color:var(--quiet)}
.step.done .dot{background:var(--go);border-color:var(--go);color:#15171A}
.step.done .dot svg{stroke:#15171A}
.step.here:not(.done) .dot{border-color:var(--go);color:var(--go);border-width:3px}
.step.done.here .dot{border-width:3px}
.step .lbl{font-size:.95rem;line-height:1.3}
.step.here .lbl{font-weight:680}

/* prompt box */
.prompt{border:1px solid var(--rule);border-radius:var(--r-card);overflow:hidden;background:var(--surface);margin:var(--s3) 0 var(--s4)}
.prompt-head{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s2) var(--s2) var(--s4);
  border-bottom:1px solid var(--rule-soft);background:var(--sect);flex-wrap:wrap}
.prompt-head .pl{font-size:.95rem;color:var(--muted);margin-right:auto;font-weight:600;flex:1 1 12rem}
.noticebox{border:1px solid var(--rule);border-radius:var(--r-card);background:var(--surface);
  max-height:22rem;overflow-y:auto;padding:var(--s4);margin:var(--s3) 0}
.noticebox pre{margin:0;font-family:var(--sans);font-size:.95rem;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.noticebox.read{border-color:var(--go)}
.prompt pre{margin:0;padding:var(--s4);font-family:var(--mono);font-size:.85rem;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;color:var(--ink);max-height:22rem;overflow-y:auto}

/* reference list */
.reflist{list-style:none;margin:0;padding:0}
.refrow{border:1px solid var(--rule-soft);border-radius:var(--r-card);padding:var(--s4);margin-bottom:var(--s3);background:var(--surface)}
.refrow .rt{font-size:1.1rem;font-weight:660}
.refrow .rs{font-size:.94rem;color:var(--muted);margin-top:2px}
.pill{display:inline-block;font-size:.82rem;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;font-variant-numeric:tabular-nums;padding:3px 10px;border-radius:3px;border:2px solid var(--rule);
  background:var(--sect);color:var(--muted);white-space:nowrap}
.pill.ok{border-color:var(--go);color:var(--go);background:var(--go-soft)}
.pill.todo{border-color:var(--caution);color:var(--caution);background:var(--caution-soft)}

/* settings groups — one card, 1px dividers */
.menu-list{display:grid;gap:var(--s4)}
.menu-group{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-card);overflow:hidden}
.menu{display:flex;align-items:center;gap:var(--s3);width:100%;max-width:100%;box-sizing:border-box;text-align:left;background:transparent;
  border:0;border-bottom:1px solid var(--rule-soft);border-radius:0;padding:10px var(--s4);min-height:56px;cursor:pointer;
  transition:background var(--fast) var(--ease);min-width:0}
.menu:last-child{border-bottom:0}
.menu .menu-ico{flex:none;width:24px;height:24px;color:var(--muted)}
.menu .menu-ico svg{display:block;width:24px;height:24px}
.menu .menu-body{flex:1;min-width:0;overflow:hidden}
.menu .mt{display:block;font-size:1.02rem;font-weight:660;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.menu .ms{display:block;font-size:.88rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function isFreshStart(){

  var q = root.projects[root.order[0]];
  if (!q || (q.name || "").trim()) return false;
  var a = q.about || {};
  if ((a.what || "").trim() || (a.who || "").trim() || (a.mustDo || "").trim()) return false;
  return !(q.refs || []).some(function(r){ return (r.name || "").trim() || (r.report || "").trim(); });
}

function phone(x, y, w, h, label, fill){
  var s = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="8" fill="' + (fill || "var(--surface)") + '" stroke="var(--ink)" stroke-width="3"/>';
  s += '<rect x="' + (x+8) + '" y="' + (y+12) + '" width="' + (w-16) + '" height="8" rx="4" fill="var(--rule)"/>';
  s += '<rect x="' + (x+8) + '" y="' + (y+28) + '" width="' + (w-30) + '" height="6" rx="3" fill="var(--rule-soft)"/>';
  s += '<rect x="' + (x+8) + '" y="' + (y+42) + '" width="' + (w-22) + '" height="6" rx="3" fill="var(--rule-soft)"/>';
  if (label) s += '<text x="' + (x + w/2) + '" y="' + (y + h + 20) + '" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="sans-serif">' + esc(label) + '</text>';
  return s;

function box(x, y, w, h, title, fill){

/* the whole idea, in one picture */
function picHow(){
  var s = "";
  s += phone(10, 30, 70, 100, "apps you like");
  s += phone(28, 20, 70, 100, "");
  s += arrow(115, 80, 165, 80);
  s += box(170, 50, 120, 60, "AI chat");
  s += arrow(300, 80, 350, 80);
  s += '<rect x="355" y="35" width="90" height="95" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>';
  s += '<rect x="368" y="55" width="64" height="7" rx="3" fill="var(--rule)"/>';
  s += '<rect x="368" y="70" width="52" height="6" rx="3" fill="var(--rule-soft)"/>';
  s += '<rect x="368" y="83" width="60" height="6" rx="3" fill="var(--rule-soft)"/>';
  s += '<rect x="368" y="96" width="44" height="6" rx="3" fill="var(--rule-soft)"/>';
  s += '<text x="400" y="150" text-anchor="middle" font-size="13" fill="var(--muted)" font-family="sans-serif">one file</text>';
  s += arrow(455, 80, 505, 80);
  s += phone(510, 30, 70, 100, "your app", "var(--go-soft)");
  return svg(s, 600, 165, "Apps you like, then an AI chat, then one file, then your own app");
}

/* what to send to the AI */
function picPictures(){
  var s = "";
  s += '<text x="10" y="22" font-size="15" font-weight="700" fill="var(--ink)" font-family="sans-serif">Take pictures of these screens</text>';
  var labels = ["the main screen", "when it is empty", "an error message", "a yes or no box", "on a phone"];
  labels.forEach(function(t, i){
    var x = 10 + i * 118;
    s += phone(x, 40, 84, 104, "");
    if (i === 1) s += '<text x="' + (x+42) + '" y="' + 96 + '" text-anchor="middle" font-size="26" fill="var(--rule)" font-family="sans-serif">?</text>';
    if (i === 2) s += '<rect x="' + (x+10) + '" y="70" width="64" height="22" rx="4" fill="var(--caution-soft)" stroke="var(--caution)" stroke-width="2"/>';
    if (i === 3) { s += '<rect x="' + (x+12) + '" y="66" width="60" height="30" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>';
                   s += '<rect x="' + (x+16) + '" y="84" width="24" height="9" rx="2" fill="var(--rule)"/>';
                   s += '<rect x="' + (x+44) + '" y="84" width="24" height="9" rx="2" fill="var(--go)"/>'; }
    s += '<text x="' + (x+42) + '" y="162" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="sans-serif">' + esc(t) + '</text>';
  });
  return svg(s, 600, 175, "Five kinds of picture to take: main screen, empty screen, error, a yes or no box, and the phone view");
}

/* the three moves on the step 2 screen */
function picThreeMoves(){
  var s = "";
  var steps = [["1", "Press Copy"], ["2", "Paste in the AI chat"], ["3", "Paste the answer back"]];
  steps.forEach(function(st, i){
    var x = 10 + i * 195;
    s += '<circle cx="' + (x + 28) + '" cy="40" r="24" fill="var(--go)"/>';
    s += '<text x="' + (x + 28) + '" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" font-family="sans-serif">' + st[0] + '</text>';
    s += '<text x="' + (x + 64) + '" y="36" font-size="15" font-weight="700" fill="var(--ink)" font-family="sans-serif">' + esc(st[1].split(" ")[0]) + '</text>';
    s += '<text x="' + (x + 64) + '" y="56" font-size="15" fill="var(--muted)" font-family="sans-serif">' + esc(st[1].split(" ").slice(1).join(" ")) + '</text>';
    if (i < 2) s += arrow(x + 155, 40, x + 190, 40);
  });
  return svg(s, 600, 80, "Press copy, paste it in the AI chat, then paste the answer back");
}

/* good answer and bad answer */
function picGoodBad(){
  var s = "";
  s += '<rect x="8" y="8" width="280" height="150" rx="8" fill="var(--go-soft)" stroke="var(--go)" stroke-width="3"/>';
  s += '<text x="24" y="36" font-size="15" font-weight="700" fill="var(--go)" font-family="sans-serif">GOOD answer</text>';
  ["[OBSERVED] two columns", "[MEASURED] text 14 px", "[UNKNOWN] the exact colour", "PART 2 is there"].forEach(function(t, i){
    s += '<text x="24" y="' + (62 + i*22) + '" font-size="13" fill="var(--ink)" font-family="monospace">' + esc(t) + '</text>';
  });
  s += '<rect x="312" y="8" width="280" height="150" rx="8" fill="var(--caution-soft)" stroke="var(--caution)" stroke-width="3"/>';
  s += '<text x="328" y="36" font-size="15" font-weight="700" fill="var(--caution)" font-family="sans-serif">BAD answer</text>';
  ["no labels on the lines", "exact colours you never sent", "nothing marked unknown", "PART 2 is missing"].forEach(function(t, i){
    s += '<text x="328" y="' + (62 + i*22) + '" font-size="13" fill="var(--ink)" font-family="monospace">' + esc(t) + '</text>';
  });
  return svg(s, 600, 168, "A good answer has labels and a part two. A bad answer has neither.");
}

  h += '<li><b>Step 1. About your app.</b> Answer seven short questions. Facts about your life. Not design questions.</li>';
  h += '<li><b>Step 2. Look at apps you like.</b> Take pictures of them. Copy the words. Paste them in the AI chat with the pictures. Paste the answer back here.</li>';
  h += '<li><b>Step 3. Pick one to follow.</b> The AI picks one main app for you and says why.</li>';
  h += '<li><b>Step 4. Make your plan.</b> The AI writes simple rules for sizes, colours and spacing.</li>';
  h += '<li><b>Step 5. Give it to the AI.</b> Save one file. Give that file to any AI before it builds your app.</li></ol>';

function viewPrompts(){
  var h = '<div class="card"><h1>Message wording</h1>';
  h += '<p class="lede"><b>You do not need this screen.</b> The app already writes every message for you. It is here for two reasons only: if somebody sends you improved wording, or if you wish to change the wording yourself.</p>';
  h += '<div class="kv"><div class="k">Message version</div><div class="v">' + esc(root.promptPack || PROMPT_PACK_VERSION) + (Object.keys(root.prompts||{}).length ? " (you have changed some)" : " (as they came)") + '</div></div>';
  h += '<div class="note">If someone sends you an updated message file, open it here. Your own work is not affected.</div>';
  h += '<div class="row"><button class="btn go" id="pkOpenBtn">Open a message file</button>';
  h += '<button class="btn ghost" id="pkSave">Save these messages</button>';
  h += '<button class="btn ghost" id="pkShare">Share them</button>';
  h += '<input type="file" id="pkOpen" accept="application/json" hidden></div>';

  h += '<h2 style="margin-top:var(--s6)">Reword a message</h2>';
  h += '<p class="lede">If a change goes wrong, press <b>Restore original</b> on that message.</p>';
  PROMPT_LIST.forEach(function(pl){
    var name = pl[0], changed = isChanged(name);
    h += '<div class="refrow"><div class="row end"><div style="flex:1 1 14rem">';
    h += '<div class="rt">' + esc(pl[1]) + '</div><div class="rs">' + esc(pl[2]) + '</div></div>';
    h += '<span class="pill ' + (changed ? "todo" : "ok") + '">' + (changed ? "changed by you" : "as it came") + '</span></div>';
    h += '<div class="row" style="margin-top:var(--s3)"><button class="btn ghost sm" data-editp="' + name + '">Reword</button>';
    if (changed) h += '<button class="btn ghost sm" data-resetp="' + name + '">Restore original</button>';
    h += '</div></div>';

  h += '<div class="row end" style="margin-top:var(--s5)"><button class="btn ghost" data-go="publisher">Publisher settings</button><button class="btn ghost" data-go="home">Home</button></div>';
  h += '</div>';
  return h;
}
function viewPromptEdit(){
  var name = VIEW.refId, meta = null;
  PROMPT_LIST.forEach(function(p){ if (p[0] === name) meta = p; });
  if (!meta) return viewPrompts();
  var h = '<div class="card"><h1>' + esc(meta[1]) + '</h1>';
  h += '<p class="lede">' + esc(meta[2]) + '</p>';
  h += '<div class="note"><b>The pieces in curly brackets get filled in for you.</b> Keep them. If you delete one, that information will not reach the AI.</div>';
  h += '<div style="margin-bottom:var(--s4)">';
  TOKENS.forEach(function(t){ h += '<div class="kv"><div class="k"><code>' + esc(t[0]) + '</code></div><div class="v">' + esc(t[1]) + '</div></div>'; });
  h += '</div>';
  h += '<div class="field"><label for="p_text">The words</label><textarea id="p_text" class="big" style="min-height:360px;font-family:var(--mono);font-size:.85rem">' + esc(tmpl(name)) + '</textarea></div>';
  h += '<div class="row"><button class="btn go" id="savePrompt">Save these words</button>';
  h += '<button class="btn ghost" data-go="prompts">Back without saving</button>';
  if (isChanged(name)) h += '<button class="btn ghost" id="resetPrompt">Restore original</button>';
  h += '</div></div>';
  return h;
}

/* show or hide the write-your-own box and answer box when the choice changes */
function wireQuestionPicker(){
  var sel = document.getElementById("qSel"), own = document.getElementById("qOwnWrap"), qa = document.getElementById("qaWrap");
  if (!sel) return;
  sel.addEventListener("change", function(){
    var val = sel.value;
    var isOwn = val === OWN_QUESTION;
    if (own) own.hidden = !isOwn;
    if (qa) qa.hidden = (!val);
    if (isOwn) { var f = document.getElementById("qOwn"); if (f) f.focus(); }
    else if (val && qa) { var a = document.getElementById("qa0"); if (a) a.focus(); }
  });
}
/* the chosen question, or "" if the person picked their own and left it empty */
function chosenQuestion(){
  var sel = document.getElementById("qSel"); if (!sel) return "";
  if (sel.value === "") return "";
  if (sel.value !== OWN_QUESTION) return sel.value;
  var f = document.getElementById("qOwn");
  return f ? f.value.trim() : "";
}

function formatLastUpdateCheck(ts){
  if (!ts) return "";
  var d = new Date(ts);
  if (isNaN(d.getTime())) return "";
  var hh = String(d.getHours()); if (hh.length < 2) hh = "0" + hh;
  var mm = String(d.getMinutes()); if (mm.length < 2) mm = "0" + mm;
  var time = hh + ":" + mm;
  var now = new Date();
  if (d.toDateString() === now.toDateString()) return "today at " + time;
  try {
    return d.toLocaleDateString("en-GB", { day:"numeric", month:"long", year:"numeric" }) + " at " + time;
  } catch(e){ return when(ts); }
}

/* ==========================================================================
   SAVING, lock aware. The lock itself lives further down the file.
   ========================================================================== */
var savePending = false, saveQueued = false;
function save(){
  if (LOCK.on && LOCK.master) { saveEncrypted(); pulseSaved(); return; }
  var raw = JSON.stringify(root), ok = false;
  if (store) { try { store.setItem(KEY, raw); ok = true; } catch(e){ ok = false; } }
  if (!ok) mem[KEY] = raw;
  persistOK = ok;
  pulseSaved();
}
function saveEncrypted(){
  if (savePending) { saveQueued = true; return; }
  savePending = true;
  sealRoot().then(function(blob){
    var ok = false;
    if (store) { try { store.setItem(KEY, blob); ok = true; } catch(e){ ok = false; } }
    if (!ok) mem[KEY] = blob;
    persistOK = ok; savePending = false;
    if (saveQueued) { saveQueued = false; saveEncrypted(); }
    pulseSaved();
  }).catch(function(){ savePending = false; persistOK = false; pulseSaved(); });
}
function checkLocked(){
  var raw = (store && store.getItem(KEY)) || mem[KEY];
  if (!raw) return false;
  try {
    var d = JSON.parse(raw);
    if (d && d.enc === true && d.iv && d.data) { LOCK.needUnlock = true; LOCK.blob = d; return true; }
  } catch(e){}
  return false;
}

/* ==========================================================================
   FINGERPRINT  —  lets anyone check their copy is the real one
   ========================================================================== */
var FINGERPRINT = "";
function computeFingerprint(){
  if (!cryptoOK()) { FINGERPRINT = "not available on this browser"; return Promise.resolve(FINGERPRINT); }
  var data = new TextEncoder().encode(APP_SOURCE);
  return crypto.subtle.digest("SHA-256", data).then(function(buf){
    var a = new Uint8Array(buf), hex = "";
    for (var i=0;i<a.length;i++) hex += a[i].toString(16).padStart(2,"0");
    FINGERPRINT = hex.slice(0,32).replace(/(.{4})/g, "$1 ").trim().toUpperCase();
    return FINGERPRINT;
  }).catch(function(){ FINGERPRINT = "could not be worked out"; return FINGERPRINT; });
}

function brandedAppSource(){
  var src = APP_SOURCE;

    /* carry the current publisher details into the copy that is passed on */
    src = src.replace(/var OWNER_DEFAULT = "[^"]*";/, 'var OWNER_DEFAULT = ' + JSON.stringify(ownerName()) + ';');

/* ---------- Words file ---------- */
/* the saved record, exactly as this device holds it */
function currentRecord(){
  var raw = (store && store.getItem(KEY)) || mem[KEY];
  return raw || JSON.stringify(root);
}
function moveFileText(){
  return JSON.stringify({
    kind: MOVE_KIND, v: 1,
    app: APP_NAME, version: APP_VERSION,
    saved: new Date().toISOString(),
    lockedWhenSaved: !!(LOCK.on || LOCK.needUnlock),
    key: KEY, record: currentRecord()
  }, null, 2);
}
function looksLikeMoveFile(d){
  return !!(d && typeof d === "object" && d.kind === MOVE_KIND && typeof d.record === "string");
}
/* Take a move file. A scrambled record is written back as it is, because the
   app cannot read it without the PIN; the unlock screen then asks for that PIN.
   A readable record goes through the same cleaning as any opened file. */
function importMoveFile(d){
  var rec = d.record, parsed = null;
  try { parsed = JSON.parse(rec); } catch(e){ say("That file could not be read."); return false; }
  if (parsed && parsed.enc === true && parsed.iv && parsed.data) {
    try { if (store) store.setItem(KEY, rec); else mem[KEY] = rec; } catch(e){ mem[KEY] = rec; }
    LOCK.blob = parsed; LOCK.needUnlock = true; LOCK.on = false; LOCK.master = null;
    render();
    say("Your work arrived, still locked. Please type your PIN to open it.");
    return true;
  }
  return importData(rec);
}
function saveMoveFile(){
  downloadFile(safeName() + "-move-my-work.json", moveFileText(), "application/json");
  say(LOCK.on ? "Saved. Your work is still scrambled inside that file."
              : "Saved to your downloads. Keep it safe: it is not scrambled.");
}

function packJSON(){
  var out = { kind:"mydesignhelper-words", pack: root.promptPack || PROMPT_PACK_VERSION, words: {} };
  PROMPT_LIST.forEach(function(p){ out.words[p[0]] = tmpl(p[0]); });
  return JSON.stringify(out, null, 2);
}
function importPack(raw){
  var d;
  try { d = JSON.parse(raw); } catch(e){ say("That file could not be read. It is not a Words file."); return false; }
  if (!d || typeof d !== "object" || d.kind !== "mydesignhelper-words" || !d.words || typeof d.words !== "object") {
    say("That is not a Words file. Nothing was changed."); return false;
  }
  var names = PROMPT_LIST.map(function(p){ return p[0]; }), taken = 0;
  var clean = {};
  for (var k in d.words) {
    if (names.indexOf(k) === -1) continue;
    if (typeof d.words[k] !== "string" || !d.words[k].trim()) continue;
    clean[k] = d.words[k]; taken++;
  }
  if (!taken) { say("That Words file was empty. Nothing was changed."); return false; }
  root.prompts = clean;
  if (d.pack) root.promptPack = String(d.pack);
  save(); render();
  say("New words are in. " + taken + " set" + (taken===1?"":"s") + " updated. Your own work was not touched.");
  return true;
}

/* ---------- backup file ----------
   Anything that arrives in a file is treated as somebody else's data, not as
   ours. Names for things are made fresh here so that a file cannot choose the
   names the screen is built from. Only words we already know about are kept. */
function freshRefId(){ return "r" + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-3); }
function cleanText(v){ return typeof v === "string" ? v : ""; }
function cleanRef(r){
  var out = { id: freshRefId(), name: cleanText(r && r.name), notes: cleanText(r && r.notes),
              report: cleanText(r && r.report), history: [] };
  if (r && Array.isArray(r.history)) {
    out.history = r.history.slice(0, 50).map(function(v){
      return { t: (v && typeof v.t === "number" && isFinite(v.t)) ? v.t : Date.now(), text: cleanText(v && v.text) };
    });
  }
  return out;
}
function cleanHolder(h){
  var o = { report: cleanText(h && h.report), history: [] };
  if (h && Array.isArray(h.history)) {
    o.history = h.history.slice(0, 50).map(function(v){
      return { t: (v && typeof v.t === "number" && isFinite(v.t)) ? v.t : Date.now(), text: cleanText(v && v.text) };
    });
  }
  return o;
}
function cleanProject(d){
  var blank = blankProject(), out = blankProject();
  out.name = cleanText(d && d.name);
  var a = (d && d.about) || {};
  for (var k in blank.about) out.about[k] = cleanText(a[k]);
  out.brandNotes = cleanText(d && d.brandNotes);
  out.brand  = cleanHolder(d && d.brand);
  out.choice = cleanHolder(d && d.choice);
  out.brief  = cleanHolder(d && d.brief);
  out.refs = (d && Array.isArray(d.refs) ? d.refs : []).slice(0, 8).map(cleanRef);
  if (!out.refs.length) out.refs = [ blankRef() ];
  out.created = (d && typeof d.created === "number" && isFinite(d.created)) ? d.created : Date.now();
  return out;
}
/* only the sets of words this app knows about are taken from a file */
function cleanPrompts(o){
  var names = PROMPT_LIST.map(function(p){ return p[0]; }), out = {};
  if (o && typeof o === "object") {
    names.forEach(function(k){ if (typeof o[k] === "string" && o[k].trim()) out[k] = o[k]; });
  }
  return out;
}
function looksLikeProject(d){
  return d && typeof d === "object" && d.about && typeof d.about === "object" &&
         Array.isArray(d.refs) && d.choice && typeof d.choice === "object" &&
         d.brief && typeof d.brief === "object" && ("name" in d);
}
function importData(raw){
  var d;
  try { d = JSON.parse(raw); } catch(e){ say("That file could not be read. It is not a file from this app."); return false; }
  if (!d || typeof d !== "object") { say("That file could not be read. It is not a file from this app."); return false; }
  if (d.kind === "mydesignhelper-words") return importPack(raw);
  if (d.projects && d.currentId && d.order) {
    var ids = Object.keys(d.projects);
    if (!ids.length || !ids.every(function(k){ return looksLikeProject(d.projects[k]); }) || !d.projects[d.currentId]) {
      say("That file looks broken. Nothing was changed."); return false;
    }
    var fresh = blankRoot();
    fresh.projects = {}; fresh.order = [];
    var wasCurrent = "";
    (Array.isArray(d.order) ? d.order : ids).forEach(function(pid){
      if (!d.projects[pid]) return;
      var nid = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      fresh.projects[nid] = cleanProject(d.projects[pid]);
      fresh.order.push(nid);
      if (pid === d.currentId) wasCurrent = nid;
    });
    if (!fresh.order.length) { say("That file looks broken. Nothing was changed."); return false; }
    fresh.currentId = wasCurrent || fresh.order[0];
    fresh.prompts = cleanPrompts(d.prompts);
    if (d.promptPack) fresh.promptPack = String(d.promptPack).slice(0, 20);
    if (typeof d.owner === "string") fresh.owner = d.owner.slice(0, 120);
    if (typeof d.year === "string") fresh.year = d.year.slice(0, 20);
    if (typeof d.licence === "string" && LICENCES.some(function(l){ return l.id === d.licence; })) fresh.licence = d.licence;
    if (d.prefs && typeof d.prefs === "object") {
      if (THEMES.some(function(t){ return t[0] === d.prefs.theme; })) fresh.prefs.theme = d.prefs.theme;
      if (SIZES[d.prefs.textSize]) fresh.prefs.textSize = d.prefs.textSize;
      if (typeof d.prefs.dim === "number" && isFinite(d.prefs.dim)) fresh.prefs.dim = Math.max(0, Math.min(60, d.prefs.dim));
    }
    root = fresh;
    switchProject(root.currentId);
    applyTheme(); applySize();
    save(); render();
    var changedWords = Object.keys(root.prompts).length;
    say("Your file was opened. " + fresh.order.length + " app" + (fresh.order.length===1?"":"s") + " found." +
        (changedWords ? " It also carried " + changedWords + " changed set" + (changedWords===1?"":"s") + " of words \u2014 check them in Settings." : ""));
    return true;
  }
  if (looksLikeProject(d)) {
    var id = newProject(); root.projects[id] = cleanProject(d); switchProject(id);
    save(); render(); say("Your file was opened as a new app.");
    return true;
  }
  say("That file is broken, or it is from a different app. Nothing was changed.");
  return false;
}

/* ---------- lock operations ---------- */
function turnLockOn(pin, q, answer){
  var hasQ = !!(q && answer && answer.trim());
  var saltP = rnd(16);
  say("Setting the lock. This takes a few seconds. Please wait.");
  newMasterKey().then(function(master){
    LOCK.master = master;
    var tasks = [ keyFrom(pin, saltP, KDF_PIN) ];
    var saltQ;
    if (hasQ) {
      saltQ = rnd(16);
      tasks.push(keyFrom(answersSecret([answer]), saltQ, KDF_ANSWERS));
    }
    return Promise.all(tasks).then(function(ks){
      var wrapTasks = [ wrapMaster(master, ks[0]) ];
      if (hasQ) wrapTasks.push(wrapMaster(master, ks[1]));
      return Promise.all(wrapTasks);
    }).then(function(w){
      var b = { enc:true, v:4, saltP:b64(saltP), wrapP:w[0] };
      if (hasQ) {
        b.saltQ = b64(saltQ);
        b.wrapQ = w[1];
        b.q = q;
      }
      LOCK.blob = b;
      LOCK.on = true;
      save(); render();
      say(hasQ ? "The lock is on. Your work is now scrambled on this phone." :
                 "The lock is on with PIN only. Your work is now scrambled on this phone.");
    });
  }).catch(function(){ say("The lock could not be switched on. Please try again."); });
}
/* replace the questions on a lock that is already on */
function changeQuestions(q, answer){
  var saltQ = rnd(16), secret = answersSecret([answer]);
  say("Saving your question. This takes a few seconds. Please wait.");
  return keyFrom(secret, saltQ, KDF_ANSWERS).then(function(k){
    return wrapMaster(LOCK.master, k);
  }).then(function(w){
    LOCK.blob.saltQ = b64(saltQ); LOCK.blob.wrapQ = w; LOCK.blob.q = q;
    delete LOCK.blob.qs; LOCK.blob.v = 4;
    /* a lock that now has questions no longer needs the old printed code */
    delete LOCK.blob.saltR; delete LOCK.blob.wrapR;
    save(); render();
    say("Your question has been saved.");
  }).catch(function(){ say("That did not work. Please try again."); });
}

function wireUnlock(){
  var fld = document.getElementById("uk");
  if (fld) { fld.addEventListener("keydown", function(e){ if (e.key === "Enter") tryOpen("pin"); }); }
  var g1 = document.getElementById("doUnlock");
  if (g1) g1.addEventListener("click", function(){ tryOpen("pin"); });
  var fl = document.getElementById("forgotPinLink");
  if (fl) fl.addEventListener("click", function(e){
    e.preventDefault();
    var sec = document.getElementById("forgotPinSection");
    if (sec) {
      sec.scrollIntoView({ behavior:"smooth" });
      var firstInput = sec.querySelector("input");
      if (firstInput) setTimeout(function(){ firstInput.focus(); }, 300);
    }
  });
  var g2 = document.getElementById("doRecover");
  if (g2) g2.addEventListener("click", function(){ tryOpen("rec"); });
  var g3 = document.getElementById("doAnswers");
  if (g3) g3.addEventListener("click", function(){ tryOpen("answers"); });
  var ob = document.getElementById("uOpenBtn");
  if (ob) ob.addEventListener("click", function(){ document.getElementById("uOpen").click(); });
  var of2 = document.getElementById("uOpen");
  if (of2) of2.addEventListener("change", function(e){
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      var d;
      try { d = JSON.parse(r.result); } catch(err){ say("That file could not be read."); return; }
      if (!d || !d.projects) { say("That is not a file from this app."); return; }
      LOCK.needUnlock = false; LOCK.on = false; LOCK.master = null; LOCK.blob = null;
      root = d;
      var br = blankRoot(); for (var k in br) if (!(k in root)) root[k] = br[k];
      if (!root.prompts || typeof root.prompts !== "object") root.prompts = {};
      switchProject(root.currentId || root.order[0]);
      save(); render();
      say("Your saved copy has been opened. The lock is now off. You can set a new PIN whenever you like.");
    };
    r.readAsText(f);
  });
  var wp = document.getElementById("uWipe");
  if (wp) wp.addEventListener("click", function(){
    confirmDialog("Remove the locked work and start fresh?",
      "The work on this phone will be gone for good. This cannot be undone. Only do this if you have forgotten your PIN and cannot answer your question.",
      "Let me try again", "Remove it and start fresh", function(){
        try { if (store) store.removeItem(KEY); } catch(e){}
        delete mem[KEY];
        LOCK.needUnlock = false; LOCK.on = false; LOCK.master = null; LOCK.blob = null;
        root = blankRoot(); P = root.projects[root.currentId];
        save(); render(); say("Everything has been removed. You are starting fresh.");
      });
  });
}
function tryOpen(which){
  var secret;
  if (which === "answers") {
    var ans = [], missing = false, n = lockQuestions(LOCK.blob).length || 1;
    for (var i=0;i<n;i++){
      var f = document.getElementById("ua"+i);
      var v = f ? f.value : "";
      if (!normAnswer(v)) missing = true;
      ans.push(v);
    }
    if (missing) { say(n > 1 ? "Please answer all the questions." : "Please type your answer first."); return; }
    secret = answersSecret(ans);
  } else {
    var el = document.getElementById(which === "pin" ? "uk" : "urec");
    secret = (el && el.value || "").trim();
    if (!secret) { say(which === "pin" ? "Please type your PIN first." : "Please type your recovery code first."); return; }
  }
  say(which === "answers" ? "Checking your answer. This takes a few seconds. Please wait." : "Opening. Please wait a moment.");
  openRoot(LOCK.blob, secret, which).then(function(res){
    var d = JSON.parse(res.text);
    root = d;
    var br = blankRoot(); for (var k in br) if (!(k in root)) root[k] = br[k];
    if (!root.prompts || typeof root.prompts !== "object") root.prompts = {};
    if (!root.projects[root.currentId]) root.currentId = root.order[0];
    P = root.projects[root.currentId];
    var bp = blankProject(); for (var k2 in bp) if (!(k2 in P)) P[k2] = bp[k2];
    LOCK.master = res.master; LOCK.on = true; LOCK.needUnlock = false;
    render();
    say(which === "pin" ? "Welcome back." :
        which === "answers" ? "Opened with your answer. Please set a new PIN now, in Settings, then Lock." :
        "Opened with your recovery code. Please set a new PIN now, and choose your question.");
  }).catch(function(){
    say(which === "pin" ? "That PIN did not work. Please try again." :
        which === "answers" ? "That answer did not work. Capital letters and extra spaces do not matter, but the words must be the same ones you typed when you set the lock." :
        "That recovery code did not work. Please check every letter.");
  });
}

/* ---------- start ---------- */
computeFingerprint();
checkLocked();
/* Write the upgraded publisher details back, so they do not reappear.
   Never do this while the work is locked: saving before unlocking would
   overwrite the scrambled data with an unscrambled copy. */
if (PUB_UPGRADED && !LOCK.needUnlock) save();
if (location.hash) applyHashState(location.hash);
paintNavIcons();
render();
try { if (!location.hash) history.replaceState(null, "", location.pathname + location.search + currentHash()); } catch(e){}
updateChrome();
measureTop();
measureBottom();

/* ---------- progressive web app: install and updates ---------- */
function updatesAllowed(){
  return !root.prefs || root.prefs.checkUpdates !== false;
}
function watchWorker(worker){
  if (!worker) return;
  worker.addEventListener("statechange", function(){
    if (worker.state === "installed" && navigator.serviceWorker.controller) {
      PWA.waiting = worker;
      paintUpdateBar();
      if (typeof VIEW !== "undefined" && (VIEW.id === "updates" || VIEW.id === "settings")) render();
    }
  });
}
function applyWaitingUpdate(){
  if (!PWA.waiting || PWA.reloading) return;
  PWA.reloading = true;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if (PWA.reloading) { PWA.reloading = false; location.reload(); }
  }, { once:true });
  PWA.waiting.postMessage({ type:"SKIP_WAITING" });
}
function setUpdateCheckResult(kind, extra){
  var box = document.getElementById("updCheckResult");
  var msg = document.getElementById("updCheckMsg");
  if (!box && !msg) { if (extra) say(extra); return; }
  if (!box) { if (msg) msg.textContent = extra || ""; return; }
  if (kind === "checking") {
    box.innerHTML = '<p class="lede" id="updCheckMsg">Checking\u2026</p>';
  } else if (kind === "ready") {
    box.innerHTML = '<p class="lede" id="updCheckMsg">A newer version is ready.</p>' +
      '<div class="row"><button class="btn go" id="updApply">Update now</button></div>';
    var b = document.getElementById("updApply");
    if (b) b.addEventListener("click", applyWaitingUpdate);
  } else if (kind === "current") {
    var last = formatLastUpdateCheck(root.prefs.lastUpdateCheck);
    box.innerHTML = '<p class="lede" id="updCheckMsg">You have the newest version.' +
      (last ? " Last checked: " + esc(last) + "." : "") + "</p>";
  } else if (kind === "unreachable") {
    box.innerHTML = '<p class="lede" id="updCheckMsg">The check could not be reached. Try again when you have a connection.</p>';
  } else if (kind === "file") {
    box.innerHTML = '<p class="lede" id="updCheckMsg">A copy you saved as a file never checks for updates.</p>';
  } else if (kind === "text") {
    box.innerHTML = '<p class="lede" id="updCheckMsg">' + esc(extra || "") + "</p>";
  }
}
function manualUpdateCheck(){
  if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) {
    setUpdateCheckResult("file");
    return;
  }
  setUpdateCheckResult("checking");
  try {
    var p = PWA.reg ? Promise.resolve(PWA.reg) : navigator.serviceWorker.getRegistration();
    p.then(function(reg){
      if (!reg) {
        setUpdateCheckResult("text", "No update service is registered yet. Try again in a moment.");
        return;
      }
      return reg.update().then(function(){
        if (reg.waiting) {
          PWA.waiting = reg.waiting;
          paintUpdateBar();
          setUpdateCheckResult("ready");
          if (typeof VIEW !== "undefined" && VIEW.id === "settings") render();
        } else if (reg.installing) {
          setUpdateCheckResult("text", "A newer version is downloading. Please wait a moment.");
          watchWorker(reg.installing);
        } else {
          root.prefs.lastUpdateCheck = new Date().toISOString();
          save();
          setUpdateCheckResult("current");
          if (typeof VIEW !== "undefined" && VIEW.id === "settings") render();
        }
      }).catch(function(){
        setUpdateCheckResult("unreachable");
      });
    }).catch(function(){
      setUpdateCheckResult("unreachable");
    });
  } catch(e){
    setUpdateCheckResult("unreachable");
  }
}
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register("/sw.js").then(function(reg){
    PWA.reg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) {
      PWA.waiting = reg.waiting;
      paintUpdateBar();
    }
    reg.addEventListener("updatefound", function(){ watchWorker(reg.installing); });
    if (updatesAllowed()) {
      try {
        reg.update().then(function(){
          if (!reg.waiting && !reg.installing) {
            root.prefs.lastUpdateCheck = new Date().toISOString();
            save();
          }
        }).catch(function(){});
      } catch(e){}
    }
  }).catch(function(){ /* registration failed; the page still works */ });
}
